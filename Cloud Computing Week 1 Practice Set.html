<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Computing – Week 1 Practice Set</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dk:#0A2647;--bl:#1E5A96;--ac:#2C7FCE;--pl:#EAF2FB;--lg:#F4F6F8;--bd:#DCE3EA;--tx:#171A1E;--bg:#fff;--card:#fff;--ok:#1a8f4c;--okb:#e6f6ec;--no:#c0392b;--nob:#fdecea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--card:#142234;--tx:#e6ecf3;--pl:#16304d;--lg:#142234;--bd:#2a3d55;--dk:#9cc7f0;--bl:#7fb5ea;--ok:#4cc47f;--no:#ff7b6b;--okb:#12341f;--nob:#3a1a17}}
:root[data-theme="dark"]{--bg:#0d1520;--card:#142234;--tx:#e6ecf3;--pl:#16304d;--lg:#142234;--bd:#2a3d55;--dk:#9cc7f0;--bl:#7fb5ea;--ok:#4cc47f;--no:#ff7b6b;--okb:#12341f;--nob:#3a1a17}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.6 Poppins,system-ui,sans-serif}
.pg{max-width:820px;margin:0 auto;padding:22px 18px 110px}
header{background:#0A2647;color:#fff;border-radius:10px;padding:24px 26px;border-left:8px solid #2C7FCE}
header small{letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:#9cc7f0;font-size:11px}
header h1{margin:4px 0;font-size:24px;font-weight:700;line-height:1.25}header p{margin:0;font-weight:300;color:#d5e4f5;font-size:13px}
.stat{background:var(--pl);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;margin:16px 0 14px}
.stat .r{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--dk)}
.bar{height:8px;background:var(--bd);border-radius:5px;margin-top:7px;overflow:hidden}.bar div{height:100%;background:var(--ac);width:0;transition:width .3s}
.res{background:var(--dk);color:#fff;border-radius:10px;padding:18px 22px;margin-bottom:14px;display:none}
.res h2{margin:0;font-size:30px;font-weight:700}.res p{margin:4px 0 0;font-weight:300;font-size:13px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.q.ok{border-left:5px solid var(--ok)}.q.no{border-left:5px solid var(--no)}.q.na{border-left:5px solid #b9a24a}
.q h3{margin:0 0 9px;font-size:14px;font-weight:600;color:var(--dk)}.q h3 span{color:var(--ac);margin-right:6px}
.o{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:var(--lg);border:1.5px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 11px;margin:6px 0;font:400 13.5px/1.45 Poppins,sans-serif;cursor:pointer}
.o b{min-width:20px;color:var(--bl)}.o:hover:not(:disabled){border-color:var(--ac)}.o.sel{background:var(--pl);border-color:var(--ac)}
.o.c{background:var(--okb);border-color:var(--ok)}.o.w{background:var(--nob);border-color:var(--no)}.o:disabled{cursor:default}
.key{margin-top:8px;padding:8px 11px;border-radius:6px;font-size:12.5px;font-weight:500}
.key.ok{background:var(--okb);color:var(--ok)}.key.no{background:var(--nob);color:var(--no)}.key.na{background:var(--lg);color:var(--dk)}
.empty{background:var(--pl);border:1px dashed var(--ac);border-radius:10px;padding:30px;text-align:center;color:var(--dk)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:9}
.dock button{font:600 13px Poppins,sans-serif;border-radius:8px;padding:10px 22px;cursor:pointer;border:1.5px solid var(--ac)}
#sub{background:var(--ac);color:#fff}#rst{background:var(--card);color:var(--ac)}.dock button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:520px){header h1{font-size:20px}}
</style>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="pg">
<header>
<small>NPTEL · Cloud Computing · IIT Kharagpur</small>
<h1>Practice Set: Week 1</h1>
<p>20 questions · 1 mark each · select answers and submit</p>
</header>

<div class="stat">
<div class="r"><span id="st1">0 / 20 answered</span><span id="st2">Progress 0%</span></div>
<div class="bar"><div id="pb"></div></div>
</div>
<div class="res" id="res"></div>
<div id="qs"></div>
</div>
<div class="dock"><button id="rst">↻ Reset Week</button><button id="sub">Submit Week</button></div>
<script>
const Q = [
"Which of the following best represents the meaning of resource pooling in cloud computing?|Every customer receives a permanently dedicated physical server.|Computing resources are dynamically assigned to multiple customers using a shared infrastructure.|Resources can only be accessed from a local network.|Users must manually allocate hardware before using cloud services.|B",
"A startup rents virtual servers on Amazon EC2. The team installs and patches its own operating system, configures the web server, and manages the runtime and applications itself. The provider supplies only the virtualized compute, storage, and networking. This is best classified as:|SaaS|PaaS|IaaS|FaaS|C",
"Which deployment model allows an organization to maintain cloud infrastructure exclusively for its own use, either on-premises or hosted by a third party?|Public Cloud|Hybrid Cloud|Community Cloud|Private Cloud|D",
"Virtualization technology allows multiple virtual machines (VMs) to run on a single physical system or on a cluster of physical systems. Which of the following statements is the MOST accurate?|Each VM always shares the same operating system kernel with the host OS.|Multiple VMs can run different operating systems on the same physical machine simultaneously.|Virtualization is only possible in cloud computing environments.|Virtualization prevents resource overcommitment on the host system.|B",
"Consider the following statements about distributed systems (DS): (i) DS can improve scalability by adding more nodes to the system. (ii) DS can increase fault tolerance through data and service replication. (iii) DS guarantees lower latency for every single operation compared to a centralized system. Choose the MOST APPROPRIATE option:|(i) and (ii)|(Only (iii))|(i) and (iii)|(i), (ii), and (iii)|A",
"The combination of Service-Oriented Architecture (SOA) and Cloud Computing led to a paradigm where almost any IT capability can be delivered as a network-accessible service. This is often referred to as:|FTP|SNTP|XaaS|FaaS|C",
"Which of the following correctly describes a Type-2 (hosted) hypervisor?|It runs directly on the physical hardware without any underlying operating system.|It runs as an application on top of a host operating system.|It always provides lower virtualization overhead than a Type-1 hypervisor.|It cannot run more than one virtual machine at a time.|B",
"Which of the following are advantages of Platform-as-a-Service (PaaS)? (i) Developers can focus primarily on application development. (ii) Automatic software updates for the underlying platform. (iii) Complete control over physical server hardware. (iv) Faster application deployment.|(i), (ii), and (iv)|(ii) and (iii)|(i) and (iii)|(i), (ii), (iii), and (iv)|A",
"Which of the following services is most likely to be classified as Infrastructure as a Service (IaaS)?|Microsoft Word Online|Amazon EC2 Virtual Machines|Google Docs|Salesforce CRM|B",
"A __________ is a form of distributed computing in which a large number of geographically dispersed and often heterogeneous resources across multiple administrative domains are loosely coupled and coordinated to work together on a common, large-scale task.|Cluster|Grid|Node|Hypervisor|B",
"Which of the following is NOT one of the five essential characteristics of cloud computing defined by NIST?|On-demand self-service|Broad network access|Resource pooling|Dedicated physical hardware for every customer|D",
"Which of the following correctly represents the order of computing paradigms discussed in the course?|Distributed → Cluster → Grid → Utility → Cloud|Distributed → Grid → Cluster → Utility → Cloud|Grid → Distributed → Cluster → Cloud → Utility|Cluster → Distributed → Grid → Cloud → Utility|B",
"Which of the following is the BEST description of rapid elasticity in cloud computing?|Resources are permanently allocated to each customer.|Resources can be rapidly provisioned and released according to demand.|Users must manually purchase physical servers whenever demand increases.|Resources can only be increased but never decreased.|B",
"A cloud provider serves multiple customers using a common pool of computing resources while dynamically assigning resources according to demand. This concept is known as:|Resource pooling|Vertical scaling|Dedicated hosting|Single system image|A",
"Which of the following correctly distinguishes vertical scaling from horizontal scaling?|Vertical scaling adds more machines, while horizontal scaling increases the capacity of one machine.|Vertical scaling increases resources of a single computation unit, while horizontal scaling adds more computation units.|Both methods require increasing resources of the same physical machine.|Horizontal scaling means replacing software with hardware.|B",
"In a three-tier client–server architecture, which tier is responsible for coordinating the application, processing commands, making logical decisions, and performing calculations?|Presentation tier|Logic tier|Data tier|Physical tier|B",
"Which statement correctly describes the difference between SaaS, PaaS, and IaaS?|SaaS provides fundamental infrastructure, PaaS provides physical servers, and IaaS provides only applications.|SaaS allows users to use applications, PaaS allows developers to deploy applications, and IaaS provides fundamental computing resources.|SaaS and PaaS are identical, while IaaS is only used for networking.|IaaS provides applications, while SaaS provides virtual machines.|B",
"A company needs additional computing capacity only when its private cloud becomes overloaded and wants to release those resources when the workload decreases. Which concept is most appropriate?|Cloud bursting|Virtual LAN|Single system image|Dedicated hosting|A",
"Which of the following BEST describes Network Function Virtualization (NFV)?|Replacing software-based network functions with dedicated physical appliances.|Implementing network functions as software running on standard server hardware.|Restricting network functions to one physical location.|Providing every network function with a separate physical server.|B",
"Which statement about cloud networking and service models is CORRECT?|As the level of abstraction increases, the customer generally manages more physical network layers.|In SaaS, the customer is responsible for managing the physical and data-link layers.|As the cloud service model becomes more abstract, the provider generally handles more layers.|IaaS completely removes the customer's responsibility for operating systems and applications.|C"
];

const state = new Array(Q.length).fill(null);
let submitted = false;

const qs = document.getElementById('qs');
const res = document.getElementById('res');
const st1 = document.getElementById('st1');
const st2 = document.getElementById('st2');
const pb = document.getElementById('pb');

function renderQuestions(){
  qs.innerHTML = '';
  Q.forEach((item, idx) => {
    const [question, a, b, c, d, answer] = item.split('|');
    const qWrap = document.createElement('div');
    qWrap.className = 'q';
    qWrap.innerHTML = `
      <h3><span>Q${idx + 1}</span>${question}</h3>
      <button class="o ${(state[idx] === 'A') ? 'sel' : ''} ${(submitted && answer === 'A') ? 'c' : ''} ${(submitted && state[idx] === 'A' && answer !== 'A') ? 'w' : ''}" data-index="${idx}" data-opt="A" ${submitted ? 'disabled' : ''}><b>A.</b>${a}</button>
      <button class="o ${(state[idx] === 'B') ? 'sel' : ''} ${(submitted && answer === 'B') ? 'c' : ''} ${(submitted && state[idx] === 'B' && answer !== 'B') ? 'w' : ''}" data-index="${idx}" data-opt="B" ${submitted ? 'disabled' : ''}><b>B.</b>${b}</button>
      <button class="o ${(state[idx] === 'C') ? 'sel' : ''} ${(submitted && answer === 'C') ? 'c' : ''} ${(submitted && state[idx] === 'C' && answer !== 'C') ? 'w' : ''}" data-index="${idx}" data-opt="C" ${submitted ? 'disabled' : ''}><b>C.</b>${c}</button>
      <button class="o ${(state[idx] === 'D') ? 'sel' : ''} ${(submitted && answer === 'D') ? 'c' : ''} ${(submitted && state[idx] === 'D' && answer !== 'D') ? 'w' : ''}" data-index="${idx}" data-opt="D" ${submitted ? 'disabled' : ''}><b>D.</b>${d}</button>
      ${submitted ? `<div class="key ${(state[idx] === answer) ? 'ok' : 'no'}">${(state[idx] === answer) ? 'Correct' : 'Incorrect'} · Correct answer: ${answer}</div>` : ''}
    `;
    qs.appendChild(qWrap);
  });

  document.querySelectorAll('.o').forEach(btn => {
    btn.addEventListener('click', () => {
      if (submitted) return;
      const idx = Number(btn.dataset.index);
      const opt = btn.dataset.opt;
      state[idx] = state[idx] === opt ? null : opt;
      renderQuestions();
      updateProgress();
    });
  });

  updateProgress();
}

function updateProgress(){
  const answered = state.filter(v => v !== null).length;
  const pct = Math.round((answered / Q.length) * 100);
  st1.textContent = `${answered} / ${Q.length} answered`;
  st2.textContent = `Progress ${pct}%`;
  pb.style.width = pct + '%';
}

function submitWeek(){
  submitted = true;
  const correct = state.reduce((count, chosen, idx) => {
    const answer = Q[idx].split('|')[5];
    return count + (chosen === answer ? 1 : 0);
  }, 0);

  const pct = Math.round((correct / Q.length) * 100);
  res.style.display = 'block';
  res.innerHTML = `<h2>${correct}/${Q.length}</h2><p>You scored ${pct}% on Cloud Computing Week 1.</p>`;
  renderQuestions();
}

function resetWeek(){
  submitted = false;
  state.fill(null);
  res.style.display = 'none';
  renderQuestions();
}

document.getElementById('sub').addEventListener('click', submitWeek);
document.getElementById('rst').addEventListener('click', resetWeek);
renderQuestions();
</script>
</body>
</html>
