const L="ABCD",S={w:1,a:{},d:{}};for(let i=1;i<=6;i++){S.a[i]={};S.d[i]=false}
const $=id=>document.getElementById(id),P=w=>W[w].map(s=>{const p=s.split("|");return{q:p[0],o:p.slice(1,5),k:L.indexOf(p[5])}});
const score=w=>P(w).reduce((n,q,i)=>n+(S.a[w][i]===q.k?1:0),0);
function tabs(){$("tabs").innerHTML=[1,2,3,4,5,6].map(w=>{const n=W[w].length,t=S.d[w]?score(w)+"/"+n:Object.keys(S.a[w]).length+"/"+(n||30);return`<button class="tab ${w==S.w?"on":""}" onclick="go(${w})"><b>Week ${w}</b><i>${S.d[w]?"Score "+t:n?t+" done":"Coming"}</i></button>`}).join("")}
function go(w){S.w=w;draw();scrollTo({top:0,behavior:"smooth"})}
function pick(i,j){const w=S.w;if(S.d[w])return;S.a[w][i]=j;draw(true)}
function draw(keep){const w=S.w,Q=P(w),d=S.d[w],n=Q.length,at=Object.keys(S.a[w]).length,y=scrollY;
tabs();$("st1").textContent=`Week ${w} · ${at}/${n||30} answered`;$("st2").textContent=n?Math.round(at/n*100)+"%":"–";$("pb").style.width=(n?at/n*100:0)+"%";
$("sub").disabled=!n||d;$("rst").disabled=!n;
const r=$("res");if(d){const c=score(w),un=n-at;r.style.display="block";r.innerHTML=`<h2>${c} / ${n} marks</h2><p>${Math.round(c/n*100)}% · ✔ ${c} correct · ✘ ${at-c} incorrect · ${un} unattempted</p>`}else r.style.display="none";
$("qs").innerHTML=n?Q.map((q,i)=>{const s=S.a[w][i],st=d?(s===undefined?"na":s===q.k?"ok":"no"):"";
return`<div class="q ${st}"><h3><span>Q${i+1}.</span>${q.q}</h3>${q.o.map((t,j)=>`<button class="o ${!d&&s===j?"sel":""} ${d&&j===q.k?"c":""} ${d&&s===j&&j!==q.k?"w":""}" ${d?"disabled":""} onclick="pick(${i},${j})"><b>${L[j]}.</b><span>${t}</span></button>`).join("")}${d?`<div class="key ${st}">${st=="ok"?"✔ Correct (+1)":st=="no"?"✘ Incorrect (0) · You chose "+L[s]:"Not attempted (0)"} — Correct answer: ${L[q.k]}. ${q.o[q.k]}</div>`:""}</div>`}).join(""):`<div class="empty"><h3>Week ${w}</h3>Questions for this week will be added soon.</div>`;
if(keep)scrollTo(0,y)}
$("sub").onclick=()=>{const w=S.w,n=W[w].length,at=Object.keys(S.a[w]).length;if(at<n&&!confirm(`${n-at} question(s) unanswered. Submit anyway?`))return;S.d[w]=true;draw();scrollTo({top:0,behavior:"smooth"})};
$("rst").onclick=()=>{const w=S.w;S.a[w]={};S.d[w]=false;draw();scrollTo({top:0,behavior:"smooth"})};
draw();
</script></body></html>
